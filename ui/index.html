<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <title>Sundhed</title>
    <link rel="stylesheet" href="https://assets.legacyroleplay.dk/fonts/gilroy/stylesheet.css" />
    <link rel="stylesheet" href="colors.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="app" id="app" data-theme="dark">
        <!-- ===================== SUNDHED (forside) ===================== -->
        <section class="page" id="page-sundhed" data-page="sundhed">
            <header class="page-header">
                <h1>Sundhed</h1>
            </header>

            <div class="card-list">
                <!-- Vågen i -->
                <div class="card">
                    <div class="card-icon icon-purple">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </div>
                    <div class="card-body">
                        <div class="card-label label-purple">Vågen i</div>
                        <div class="card-value"><span id="awakeValue">0 min 0 sek</span></div>
                    </div>
                </div>

                <!-- Skridt -->
                <div class="card">
                    <div class="card-icon icon-orange">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="13" cy="4" r="2"></circle>
                            <path d="M8 21l3-7 3 2v6"></path>
                            <path d="M17 14l-3-3 2-4-4 1-2-2"></path>
                            <path d="M7 13l3-2"></path>
                        </svg>
                    </div>
                    <div class="card-body">
                        <div class="card-label label-orange">Skridt</div>
                        <div class="card-value"><span id="stepsValue">0</span> <span class="unit">skridt</span></div>
                    </div>
                </div>

                <!-- Koert i bil -->
                <div class="card">
                    <div class="card-icon icon-green">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10l-2-5H6L4 10s-2.7.6-4.5 1.1C.7 11.3 0 12.1 0 13v3c0 .6.4 1 1 1h2">
                            </path>
                            <circle cx="7" cy="17" r="2.5"></circle>
                            <circle cx="17" cy="17" r="2.5"></circle>
                            <path d="M5 10l1.5-3.5h7L15 10"></path>
                        </svg>
                    </div>
                    <div class="card-body">
                        <div class="card-label label-green">Kørt i bil</div>
                        <div class="card-value"><span id="carValue">0</span> <span class="unit" id="carUnit">m</span>
                        </div>
                    </div>
                </div>

                <!-- Puls -->
                <div class="card">
                    <div class="card-icon icon-red">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                    </div>
                    <div class="card-body">
                        <div class="card-label label-red">Puls</div>
                        <div class="card-value"><span id="heartValue">70</span> <span class="unit">BPM</span></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===================== MÅL ===================== -->
        <section class="page hidden" id="page-mal" data-page="mal">
            <header class="page-header">
                <h1>Mål</h1>
            </header>

            <div class="goal-card">
                <div class="goal-ring-wrapper">
                    <svg class="goal-ring" viewBox="0 0 120 120">
                        <circle class="ring-bg" cx="60" cy="60" r="52" />
                        <circle class="ring-fg" id="goalRing" cx="60" cy="60" r="52" />
                    </svg>
                    <div class="goal-ring-text">
                        <span id="goalPercent">0%</span>
                        <small>af målet</small>
                    </div>
                </div>

                <div class="goal-info">
                    <strong id="goalStepsValue">0</strong> / <span id="goalStepsTarget">10.000</span> skridt
                </div>
            </div>

            <div class="goal-edit">
                <label for="goalInput">Dagligt skridtmål</label>
                <div class="goal-edit-row">
                    <input type="number" id="goalInput" min="1000" step="500" placeholder="10000" />
                    <button id="saveGoalBtn">Gem</button>
                </div>
            </div>
        </section>

        <!-- ===================== INDSTILLINGER ===================== -->
        <section class="page hidden" id="page-indstillinger" data-page="indstillinger">
            <header class="page-header">
                <h1>Indstillinger</h1>
            </header>

            <div class="settings-list">
                <div class="settings-row">
                    <div>
                        <div class="settings-title">Nulstil statistik</div>
                        <div class="settings-sub">Nulstiller skridt, kørsel og vågen-tid for i dag</div>
                    </div>
                    <button class="danger-btn" id="resetBtn">Nulstil</button>
                </div>
            </div>
        </section>

        <!-- ===================== BUNDMENU ===================== -->
        <nav class="tabbar">
            <button class="tab-btn active" data-target="sundhed">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                    </path>
                </svg>
                <span>Sundhed</span>
            </button>
            <button class="tab-btn" data-target="mal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="12" r="6"></circle>
                    <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
                </svg>
                <span>Mål</span>
            </button>
            <button class="tab-btn" data-target="indstillinger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
                <span>Indstillinger</span>
            </button>
        </nav>
    </div>

    <script>
        window.addEventListener('message', (e) => {
            if (e.data === 'componentsLoaded') {
                const script = document.createElement('script');
                script.src = 'script.js';
                document.body.appendChild(script);
            }
        });
    </script>
</body>

</html>
